services:
  postgres:
    image: postgres:17
    container_name: restaurante-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurante
      POSTGRES_USER: restaurante_app
      POSTGRES_PASSWORD: dev_restaurante_123
    ports:
      - "5432:5432"
    volumes:
      - restaurante_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurante_app -d restaurante"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  restaurante_dados:
